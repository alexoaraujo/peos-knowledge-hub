name: PEOS solo-maintainer review policy
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, review_requested]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  solo-review-policy:
    name: Solo-maintainer review policy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout pinned
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Review policy regression tests
        run: python3 -m unittest discover -s tests -p 'test_independent_review_gate.py' -v
      - name: Verify solo-maintainer policy (approval optional)
        env:
          PEOS_REVIEW_MODE: solo
        run: python3 .github/scripts/check_independent_review.py
