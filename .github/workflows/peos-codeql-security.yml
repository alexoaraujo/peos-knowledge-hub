name: PEOS CodeQL security analysis

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'tools/**'
      - 'hub/**'
      - 'hub-portal/**'
      - 'tests/**'
      - 'playwright.config.cjs'
      - '.github/dependabot.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'tools/**'
      - 'hub/**'
      - 'hub-portal/**'
      - 'tests/**'
      - 'playwright.config.cjs'
      - '.github/dependabot.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: peos-codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - name: Checkout pinned without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Initialize CodeQL (pinned 4.36.2)
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - name: Analyze and publish code scanning results
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e
        with:
          category: /language:${{ matrix.language }}
