name: PEOS browser E2E and search performance
on:
  pull_request:
    paths:
      - 'hub-portal/**'
      - 'tests/e2e/**'
      - 'tests/portal_search_benchmark.test.cjs'
      - 'playwright.config.cjs'
      - '.github/workflows/portal-browser-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'hub-portal/**'
      - 'tests/e2e/**'
      - 'tests/portal_search_benchmark.test.cjs'
      - 'playwright.config.cjs'
      - '.github/workflows/portal-browser-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-e2e:
    name: Chromium E2E and benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout pinned
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Runtime versions
        run: |
          node --version
          npm --version
          python3 --version
      - name: Install locked Playwright test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium and Linux system dependencies
        run: npx playwright install --with-deps chromium
      - name: Check browser test code syntax
        run: |
          node --check playwright.config.cjs
          node --check tests/e2e/portal.spec.cjs
          node --check tests/e2e/portal-accessibility.spec.cjs
          node --check tests/portal_search_benchmark.test.cjs
      - name: Run real Chromium E2E scenarios
        run: npx playwright test --config=playwright.config.cjs
      - name: Search performance sanity benchmark
        run: node --test tests/portal_search_benchmark.test.cjs
      - name: Verify full Python regression and canonical index
        run: |
          python3 -m unittest discover -s tests -v
          python3 tools/build_hub_index.py --check
      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: peos-browser-e2e-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
