name: PEOS temporary npm lockfile generation
on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - '.github/workflows/peos-generate-npm-lock.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout untrusted branch without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: npm version
        run: npm --version
      - name: Generate authentic npm lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate lockfile
        run: |
          node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync("package-lock.json","utf8"));if(d.lockfileVersion!==3||!d.packages?.["node_modules/@playwright/test"]||!d.packages?.["node_modules/@axe-core/playwright"])process.exit(1)'
      - name: Print generated lockfile for audit handoff
        run: |
          node -e 'const fs=require("fs");console.log("PEOS_LOCK_JSON_BEGIN");console.log(JSON.stringify(JSON.parse(fs.readFileSync("package-lock.json","utf8"))));console.log("PEOS_LOCK_JSON_END")'
      - name: Attach generated lockfile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: peos-npm-package-lock
          path: package-lock.json
          retention-days: 2
